workflows:
  android-apk:
    name: Compilar APK Android — AuraDefensa
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
      vars:
        NODE_OPTIONS: "--max-old-space-size=8192"
        CI: "1"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx2g -XX:MaxMetaspaceSize=512m'"
    scripts:
      - name: Instalar dependencias del monorepo (hoisted)
        script: |
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          corepack enable
          npx pnpm@9 install --no-frozen-lockfile

      - name: Generar carpeta Android nativa
        script: |
          cd artifacts/mobile
          rm -rf android
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx expo prebuild --platform android --no-install

      - name: Generar APK Release
        script: |
          cd artifacts/mobile/android
          chmod +x gradlew
          export NODE_OPTIONS="--max-old-space-size=8192"
          ./gradlew assembleRelease -x lint --no-daemon --stacktrace

    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/**/*.apk
